<div class="container">
    <div class="row">
        <div class="col-sm-12">
            <div class="title">
                <h1>Create User</h1> <!-- Title for create user page-->
            </div>
        </div>
    </div>
</div>

<div class="container create-user"> <!-- Container for create user form-->
    <div class="row">
        <div class="col-sm-12">
            <ng-container> <!-- create user form-->
               <form [formGroup]="userForm" (ngSubmit)="onSubmit()" (keydown.enter)="$event.preventDefault()">
                    <div class="form-group user-name">
                        <label for="name">Name:</label> <!--Input field for new user name-->
                        <input type="text" placeholder="Name" name="name" id="name" class="form-control" formControlName="name"
                            [ngClass]="{ 'error' : isInvalid('name') }">
                    </div>
                    <div class="form-group user-username">
                        <label for="username">Username:</label> <!--Input field for new user username-->
                        <input type="text" placeholder="Username" name="username" id="username" class="form-control" formControlName="username"
                            [ngClass]="{ 'error' : isInvalid('username') }">
                    </div>
                    <div class="form-group user-email">
                        <label for="email">Email:</label> <!--Input field for new user email-->
                        <input type="text" placeholder="Email" name="email" id="email" class="form-control" formControlName="email"
                            [ngClass]="{ 'error' : isInvalid('email') }">
                    </div>
                    <div class="form-group user-password">
                        <label for="password">Password:</label><!--Input field for new user password-->
                        <input type="text" placeholder="Password" name="password" id="password" class="form-control" formControlName="password"
                            [ngClass]="{ 'error' : isInvalid('password') }">
                    </div>
                    <div class="form-group user-confirmPass">
                        <label for="confirmPass">Confirm Password:</label> <!--Input field for new user confirm password-->
                        <input type="text" placeholder="Confirm Password" name="confirmPass" id="confirmPass" class="form-control" formControlName="confirmPass"
                            [ngClass]="{ 'error' : isInvalid('confirmPass') }">
                    </div>
                    <div class="btns"> <!--Container for buttons-->
                        <div class="back"> <!--Back button to navigate to login page-->
                            <button class="btn btn-primary btn-back" type="button" [routerLink]="['']">
                                Back
                            </button>
                        </div>
                        <div class="createUser"> <!--Submit button for new user creation-->
                            <span *ngIf="isIncomplete()">
                            You must complete all fields <!--Message and button disabled if is Incomplete returns true-->
                            </span>
                        <button [disabled]="isIncomplete()" class="btn btn-primary btn-create-account" type="submit">
                            Submit 
                        </button>
                        </div>
                    </div>
               </form>
            </ng-container>
        </div>
    </div>
</div>
