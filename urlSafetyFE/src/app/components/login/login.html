<div class="container">
    <div class="row">
        <div class="col-sm-12">
            <div class="title">
                <h1>Login</h1> <!--Login Title-->
            </div>
        </div>
    </div>
</div>

<div class="container login">
    <div class="row">
        <div class="col-sm-12">
            <ng-container> <!--Login Form- Stops user from submitting form accidently by disabling enter key (keydown.enter)="$event.preventDefault()-->
                <form [formGroup] = "loginForm" (ngSubmit) = "onSubmit()" (keydown.enter)="$event.preventDefault()">
                    <div class="form-group"> <!--Input field for Username-->
                        <label for="username">Username:</label>
                        <input type="text" name="username" placeholder="Username" id="username" class="form-control" formControlName="username"
                            [ngClass]="{ 'error' : isInvalid('username') }">
                    </div>
                    <div class="form-group"><!--Input field for Password-->
                        <label for="password">Password:</label>
                        <input type="password" name="password" placeholder="Password" id="password" class="form-control" formControlName="password"
                            [ngClass]="{ 'error' : isInvalid('password') }">
                        <div class="forgot-password text-end mt-1">
                            <a [routerLink]="['/forgotPassword']" class="text-muted small text-decoration-none label-link">
                                Forgot Password?
                            </a>
                        </div>
                    </div>
                    <div class="btns">
                        <div class="create-account"><!--Button link to create account-->
                            <label>Don't have an Account?</label>
                            <button class="btn btn-primary btn-create-account" type="button" [routerLink]="['/createUser']">
                                Create Account
                            </button>
                        </div>
                        <div class="submit-login"><!--If not all necessary fields have been filled-->
                            <span *ngIf="isIncomplete()">
                                You must complete all fields
                            </span>

                            <button [disabled]="isIncomplete()" class="btn btn-primary" type="submit">
                                Login <!--Login Button - if not all fields are complete, button is disabled/'greyed out'-->
                            </button>
                        </div>
                    </div>
                </form>
            </ng-container>
        </div>
    </div>
</div>
