<div class="container">
    <div class="row">
        <div class="col-sm-12">
            <div class="title">
                <h1>Forgot Password</h1> <!--Forgot Password Title-->
            </div>
        </div>
    </div>
</div>

<div class="container forgotpassword">
    <div class="row">
        <div class="col-sm-12">
            <ng-container> <!--forgot password Form- Stops user from submitting form accidently by disabling enter key (keydown.enter)="$event.preventDefault()-->
                <form [formGroup] = "forgotPasswordForm" (ngSubmit) = "onSubmit()" (keydown.enter)="$event.preventDefault()">
                    <div class="form-group"> <!--Input field for email-->
                        <label for="email">Email:</label>
                        <input type="text" name="email" placeholder="Email" id="email" class="form-control" formControlName="email"
                            [ngClass]="{ 'error' : isInvalid('email') }">
                    </div>
                    <div class="btns">
                        <div class="back"><!--Button link to login-->
                            <button class="btn btn-primary btn-back" type="button" [routerLink]="['']">
                                Back
                            </button>
                        </div>
                        <div class="submit">
                            <button [disabled]="isIncomplete()" class="btn btn-primary" type="submit">
                                Submit <!--Submit Button - if not all fields are complete, button is disabled/'greyed out'-->
                            </button>
                        </div>
                    </div>
                </form>
            </ng-container>
        </div>
    </div>
</div>
